<title>PeriNest 巢穴意象 · 琥珀中的蜚蠊</title>
<desc>一只封存在琥珀里的蜚蠊俯视图，触角对应 Antenna 小程序、前胸背甲对应 Carapace Nginx、双翅对应 Wing 管理端、六足对应 Leg 移动端 H5、神经索对应 Nerve AI 网关、体侧气门对应 Spiracle MCP、胸部核心对应 Queen 后端、腹部依次为 Crop 嗉囊 RAG、Core 腺体 MySQL、Nectar 花蜜 Redis，尾部拖出的信息素痕迹对应 Pheromone Celery。</desc>
