; /etc/supervisord.d/perinest-queen.ini（Systemd 与 Supervisor 二选一）
[program:perinest-queen]
command=/opt/perinest/queen/.venv/bin/gunicorn -c /opt/perinest/queen/gunicorn.conf.py app.main:app
directory=/opt/perinest/queen
user=www-data
autostart=true
autorestart=true
startretries=5
startsecs=3
stderr_logfile=/var/log/perinest/queen.err.log
stdout_logfile=/var/log/perinest/queen.out.log
environment=PATH="/opt/perinest/queen/.venv/bin"
