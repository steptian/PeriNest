# PeriNest Queen — API 反向代理 (Carapace 背甲)
limit_req_zone $binary_remote_addr zone=pn_api:10m rate=20r/s;

upstream perinest_queen {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate     /opt/perinest/deploy/ssl/api.yourdomain.com.pem;
    ssl_certificate_key /opt/perinest/deploy/ssl/api.yourdomain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 限流熔断
    limit_req zone=pn_api burst=40 nodelay;

    # Gzip
    gzip on;
    gzip_types application/json text/plain text/css;

    location /api/ {
        proxy_pass http://perinest_queen;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /docs {
        proxy_pass http://perinest_queen;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
    }
    location /openapi.json { proxy_pass http://perinest_queen; }

    # 动静分离：Queen 静态资源直读磁盘
    location /static/ {
        alias /opt/perinest/queen/static/;
        expires 30d;
        access_log off;
    }
}
