# PeriNest Leg — 移动端 H5 静态托管
server {
    listen 443 ssl http2;
    server_name m.yourdomain.com;

    ssl_certificate     /opt/perinest/deploy/ssl/m.yourdomain.com.pem;
    ssl_certificate_key /opt/perinest/deploy/ssl/m.yourdomain.com.key;

    root /opt/perinest/leg/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }
}
