# PeriNest Wing — Web 前端静态托管
server {
    listen 443 ssl http2;
    server_name admin.yourdomain.com;

    ssl_certificate     /opt/perinest/deploy/ssl/admin.yourdomain.com.pem;
    ssl_certificate_key /opt/perinest/deploy/ssl/admin.yourdomain.com.key;

    root /opt/perinest/wing/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }
}
